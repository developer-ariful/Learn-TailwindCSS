<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body >
        <div class="w-90 mx-auto px-6 py-5 m-4 bg-purple-100 rounded-lg shadow-lg">
            <h2 class="text-xl text-green-600 mx-auto text-center font-bold">Login</h2>
            <form action="">
                <div class="mt-4">
                    <label for="email" class="w-full block text-md font-medium text-blue-500">Email</label>
                    <input type="email" value="" placeholder="Enter Email" class="px-5 py-3 text-md border rounded-md w-full my-3 outline-none">
                </div>
                <div class="mt-4">
                    <label for="password" class="w-full block text-md font-medium text-blue-500">Password</label>
                    <input type="password" value="" placeholder="*******" class="px-5 py-3 text-md border rounded-md w-full my-3 outline-none">
                </div>
                <button type="submit" class="px-5 py-3 bg-green-600 text-white rounded-lg my-5 w-full">Login</button>
            </form>
        </div>
    </body>
