<!doctype html>

<body>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="px-5">
    <!-- Dashed Border  -->
     <div class="border border-gray-300 p-10 text-center">
      <p class="text-gray-500">
        Drag and Drop Your file here
      </p>
     </div>

     <!-- Professional Card -->
      <div class="border rounded-xl border-gray-200 bg-white p-6 shadow-md hover:shadow-xl">
        <h2 class="text-xl font-bold">
          Wireless Headphone
        </h2>
        <p class="mt-2 text-gray-500">
          Premium wireless headphone
        </p>
        <button class="mt-5 rounded-lg bg-blue-600 px-5 py-2 text-white">Buy Now</button>
      </div>

      <!-- ring color -->
       <div class="ring-2 ring-blue-500 ring-offset-2">Content</div>

       <!-- divide  -->
        <div class="divide-y divide-green-500">
          <div class="p-4">User-1</div>
          <div class="p-4">User-2</div>
          <div class="p-4">User-3</div>
          <div class="p-4">User-4</div>
        </div>
       <!-- divide  -->
        <div class="divide-x flex divide-green-500">
          <div class="p-4">User-1</div>
          <div class="p-4">User-2</div>
          <div class="p-4">User-3</div>
          <div class="p-4">User-4</div>
        </div>

        <!-- opacity  -->
         <button class="opacity-20 hover:opacity-100 transition hover:shadow-lg duration-300">Buy now</button>

  </body>

  </html>
